<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icon: a glider moving diagonally on a rounded square in the app's background color -->
  <defs>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ef2ff" />
      <stop offset="1" stop-color="#7b5cff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070f" />
  <g fill="#0c1328">
    <rect x="9" y="9" width="13" height="13" rx="3" />
    <rect x="42" y="9" width="13" height="13" rx="3" />
    <rect x="9" y="25.5" width="13" height="13" rx="3" />
    <rect x="25.5" y="25.5" width="13" height="13" rx="3" />
  </g>
  <g fill="url(#cell)" filter="url(#glow)">
    <rect x="25.5" y="9" width="13" height="13" rx="3" />
    <rect x="42" y="25.5" width="13" height="13" rx="3" />
    <rect x="9" y="42" width="13" height="13" rx="3" />
    <rect x="25.5" y="42" width="13" height="13" rx="3" />
    <rect x="42" y="42" width="13" height="13" rx="3" />
  </g>
</svg>
